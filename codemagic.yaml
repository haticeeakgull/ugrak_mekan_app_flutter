workflows:
  ios-workflow:
    name: Uğrak iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --free-signing
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Cocoapods install
        script: |
          cd ios && pod install
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
