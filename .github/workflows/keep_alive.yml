name: Uğrak Projesi Otomasyonu

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Space'i Uyanık Tut (Ping)
        run: |
          # 405 hatası almamak için -L (GET) kullanıyoruz
          curl -L https://hakgul-ugrak-sbert-model.hf.space/

      - name: Vektörleri Senkronize Et (Sync)
        env:
          # GitHub Secrets'tan anahtarı çekip bir değişken olarak atıyoruz
          MY_SECRET_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          # -H ile header ekliyoruz, anahtarı değişkenden okuyoruz
          curl -X GET https://hakgul-ugrak-sbert-model.hf.space/sync-vectors \
          -H "x-sync-key: $MY_SECRET_KEY"
